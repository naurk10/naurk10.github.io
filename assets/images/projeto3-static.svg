<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" fill="#0A0A0A"/>
  <!-- Typography motion paths -->
  <path d="M 100 300 Q 250 100 400 300 T 700 300" stroke="#3A86FF" stroke-width="4" fill="none"/>
  <path d="M 100 350 Q 250 150 400 350 T 700 350" stroke="#FF006E" stroke-width="3" fill="none"/>
  <path d="M 100 400 Q 250 200 400 400 T 700 400" stroke="#06FFB4" stroke-width="2" fill="none"/>
  <text x="400" y="500" font-family="Space Grotesk, sans-serif" font-size="72" fill="white" text-anchor="middle" font-weight="bold">MOTION</text>
  <text x="400" y="560" font-family="Playfair Display, serif" font-size="48" fill="#FFBE0B" text-anchor="middle" font-style="italic">Type</text>
  <!-- Animated letter placeholders -->
  <circle cx="150" cy="150" r="40" fill="#8338EC" opacity="0.8"/>
  <rect x="600" y="100" width="80" height="80" fill="#FB5607" transform="rotate(45 640 140)"/>
  <polygon points="400,50 450,120 350,120" fill="#3A86FF"/>
</svg>
