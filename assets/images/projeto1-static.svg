<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF006E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFBE0B;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#grad1)"/>
  <circle cx="200" cy="150" r="80" fill="#8338EC" opacity="0.7" filter="url(#glow)"/>
  <circle cx="600" cy="450" r="120" fill="#3A86FF" opacity="0.6" filter="url(#glow)"/>
  <circle cx="400" cy="300" r="60" fill="#FB5607" opacity="0.8"/>
  <rect x="300" y="200" width="200" height="200" fill="#0A0A0A" opacity="0.9" rx="10"/>
  <text x="400" y="290" font-family="Arial Black, sans-serif" font-size="36" fill="#FF006E" text-anchor="middle" font-weight="bold">NEON</text>
  <text x="400" y="340" font-family="Arial Black, sans-serif" font-size="36" fill="#06FFB4" text-anchor="middle" font-weight="bold">DREAMS</text>
  <text x="400" y="380" font-family="monospace" font-size="14" fill="white" text-anchor="middle">Identidade Visual</text>
</svg>
